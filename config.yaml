search_url: "https://www.jobs.cz/prace/praha/"
cv_path: "cv.pdf"

scraping:
  max_pages: 20
  max_age_days: 3
  seen_streak_stop: 15
  request_delay_sec: 1.0
  use_playwright_fallback: true

gemini:
  stage1_model: "gemini-3.5-flash-lite"
  stage2_model: "gemini-3.5-flash"
  stage1_batch_size: 75
  max_retries: 3

output:
  reports_dir: "reports"
  logs_dir: "logs"
  db_path: "data/jobs.db"
